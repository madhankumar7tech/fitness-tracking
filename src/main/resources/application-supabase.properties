# ----------------------------------------
# SUPABASE (PRODUCTION) CONFIGURATION
# ----------------------------------------
# Note: The actual database URL, username, and password will be injected 
# automatically via Environment Variables in your hosting dashboard.

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# We set this to 'none' because you run schema.sql manually in Supabase
spring.jpa.hibernate.ddl-auto=none