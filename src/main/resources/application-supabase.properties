# Supabase PostgreSQL Database Configuration
# You can find these details in your Supabase Dashboard: Project Settings -> Database -> Connection string (JDBC)
# Example URL: jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.url=jdbc:postgresql://<YOUR_SUPABASE_HOST>:<PORT>/postgres?sslmode=require
spring.datasource.username=postgres.<YOUR_PROJECT_REF>
spring.datasource.password=<YOUR_SUPABASE_PASSWORD>
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Properties
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
