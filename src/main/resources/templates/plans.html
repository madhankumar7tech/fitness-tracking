<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Management System - Membership Plans</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="stylesheet" href="/css/style.css">
    <!-- Immediate Redirect Guard -->
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.replace('/login');
        }
    </script>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-dumbbell"></i>
            <span>APEX FITNESS</span>
        </div>
        <ul class="sidebar-menu">
            <li>
                <a href="/dashboard" class="sidebar-link">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li>
                <a href="/members" class="sidebar-link">
                    <i class="fa-solid fa-users"></i>
                    <span>Members</span>
                </a>
            </li>
            <li>
                <a href="/plans" class="sidebar-link active">
                    <i class="fa-solid fa-address-card"></i>
                    <span>Membership Plans</span>
                </a>
            </li>
            <li>
                <a href="/payments" class="sidebar-link">
                    <i class="fa-solid fa-credit-card"></i>
                    <span>Payments</span>
                </a>
            </li>
            <li>
                <a href="/schedules" class="sidebar-link">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>Workouts</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Header -->
        <header class="top-header">
            <div class="page-title">
                <h1>Membership Plans</h1>
                <p>Define billing tiers and subscription options for your gym.</p>
            </div>
            <div class="user-profile">
                <div class="user-profile-info">
                    <div class="user-profile-name">Admin Portal</div>
                    <div class="user-profile-role">Manager</div>
                </div>
                <div class="metric-icon" style="width: 32px; height: 32px; border-radius: 50%; font-size: 0.9rem;">
                    <i class="fa-solid fa-user-tie"></i>
                </div>
            </div>
        </header>

        <!-- Main Panel -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <h2>Available Membership Plans</h2>
                </div>
                <button class="btn-primary" id="btn-add-plan">
                    <i class="fa-solid fa-plus"></i> Create Plan
                </button>
            </div>

            <!-- Plans Table -->
            <div class="table-container">
                <table class="custom-table" id="plans-table">
                    <thead>
                        <tr>
                            <th>Plan Name</th>
                            <th>Monthly Fee</th>
                            <th>Duration</th>
                            <th>Description</th>
                            <th style="text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="plans-tbody">
                        <!-- Loaded dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Create/Edit Modal -->
    <div class="modal-backdrop" id="plan-modal">
        <div class="modal-window">
            <div class="modal-header">
                <h2 id="modal-title">Create Membership Plan</h2>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <form id="plan-form">
                <input type="hidden" id="plan-id">
                
                <div class="form-group">
                    <label class="form-label" for="plan-name">Plan Name</label>
                    <input type="text" id="plan-name" class="form-control" placeholder="e.g. Gold Tier Plan" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="plan-price">Price (USD)</label>
                        <input type="number" id="plan-price" step="0.01" class="form-control" placeholder="e.g. 49.99" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="plan-duration">Duration (Months)</label>
                        <input type="number" id="plan-duration" class="form-control" placeholder="e.g. 3" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="plan-desc">Description</label>
                    <textarea id="plan-desc" class="form-control" rows="3" placeholder="Provide a summary of plan features..." style="resize: none;"></textarea>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
                    <button type="button" class="btn-outline" id="btn-cancel">Cancel</button>
                    <button type="submit" class="btn-primary">Save Plan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Master Scripts -->
    <script type="module" src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadPlans();

            // Modal elements
            const modal = document.getElementById('plan-modal');
            const btnAdd = document.getElementById('btn-add-plan');
            const btnClose = document.getElementById('modal-close');
            const btnCancel = document.getElementById('btn-cancel');
            const form = document.getElementById('plan-form');

            // Open modal to add plan
            btnAdd.addEventListener('click', () => {
                document.getElementById('modal-title').textContent = "Create Plan";
                document.getElementById('plan-id').value = '';
                form.reset();
                modal.classList.add('show');
            });

            // Close modal
            const closeModal = () => modal.classList.remove('show');
            btnClose.addEventListener('click', closeModal);
            btnCancel.addEventListener('click', closeModal);

            // Save Plan Action
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const planId = document.getElementById('plan-id').value;
                const payload = {
                    name: document.getElementById('plan-name').value,
                    price: parseFloat(document.getElementById('plan-price').value),
                    durationMonths: parseInt(document.getElementById('plan-duration').value),
                    description: document.getElementById('plan-desc').value
                };

                if (planId) {
                    payload.id = parseInt(planId);
                }

                try {
                    const response = await fetch('/api/plans', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        closeModal();
                        loadPlans();
                    } else {
                        alert("Error saving plan.");
                    }
                } catch (error) {
                    console.error("Error submitting plan form:", error);
                }
            });
        });

        // Fetch and render plans
        async function loadPlans() {
            try {
                const response = await fetch('/api/plans');
                const plans = await response.json();
                
                const tbody = document.getElementById('plans-tbody');
                tbody.innerHTML = '';

                if (plans.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #646a8a; padding: 2rem;">No plans defined.</td></tr>`;
                    return;
                }

                plans.forEach(plan => {
                    const tr = document.createElement('tr');
                    
                    tr.innerHTML = `
                        <td>
                            <div style="font-weight: 600; font-size: 0.98rem; margin-bottom: 0.2rem;">${plan.name}</div>
                            <div style="font-size: 0.78rem; color: #646a8a;">Plan ID: #${plan.id}</div>
                        </td>
                        <td>
                            <div style="font-weight: 700; color: #00f2fe;">$${plan.price.toFixed(2)}</div>
                        </td>
                        <td>
                            <div>${plan.durationMonths} ${plan.durationMonths === 1 ? 'Month' : 'Months'}</div>
                        </td>
                        <td>
                            <div style="color: #9aa0c2; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${plan.description || ''}">
                                ${plan.description || '<span style="color:#646a8a">No description provided</span>'}
                            </div>
                        </td>
                        <td style="text-align: right;">
                            <button class="btn-action edit" onclick="editPlan(${plan.id})" title="Edit"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-action delete" onclick="deletePlan(${plan.id})" title="Delete"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Error loading plans:", error);
            }
        }

        // Edit plan details
        async function editPlan(id) {
            try {
                const response = await fetch('/api/plans');
                const plans = await response.json();
                const plan = plans.find(p => p.id === id);
                if (!plan) return;

                document.getElementById('modal-title').textContent = "Edit Plan";
                document.getElementById('plan-id').value = plan.id;
                document.getElementById('plan-name').value = plan.name;
                document.getElementById('plan-price').value = plan.price;
                document.getElementById('plan-duration').value = plan.durationMonths;
                document.getElementById('plan-desc').value = plan.description || '';

                document.getElementById('plan-modal').classList.add('show');
            } catch (error) {
                console.error("Error loading plan details:", error);
            }
        }

        // Delete plan handler
        async function deletePlan(id) {
            if (!confirm("Are you sure you want to delete this plan? Members assigned to this plan will have their plan set to none.")) return;
            
            try {
                const response = await fetch(`/api/plans/${id}`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    loadPlans();
                } else {
                    alert("Failed to delete plan.");
                }
            } catch (error) {
                console.error("Error deleting plan:", error);
            }
        }
    </script>
</body>
</html>
