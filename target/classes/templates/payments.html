<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Management System - Payments</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="stylesheet" href="/css/style.css">
    <!-- Immediate Redirect Guard -->
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.replace('/login');
        }
    </script>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-dumbbell"></i>
            <span>APEX FITNESS</span>
        </div>
        <ul class="sidebar-menu">
            <li>
                <a href="/dashboard" class="sidebar-link">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li>
                <a href="/members" class="sidebar-link">
                    <i class="fa-solid fa-users"></i>
                    <span>Members</span>
                </a>
            </li>
            <li>
                <a href="/plans" class="sidebar-link">
                    <i class="fa-solid fa-address-card"></i>
                    <span>Membership Plans</span>
                </a>
            </li>
            <li>
                <a href="/payments" class="sidebar-link active">
                    <i class="fa-solid fa-credit-card"></i>
                    <span>Payments</span>
                </a>
            </li>
            <li>
                <a href="/schedules" class="sidebar-link">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>Workouts</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Header -->
        <header class="top-header">
            <div class="page-title">
                <h1>Payment Ledger</h1>
                <p>Track membership fees, transaction dates, and billing states.</p>
            </div>
            <div class="user-profile">
                <div class="user-profile-info">
                    <div class="user-profile-name">Admin Portal</div>
                    <div class="user-profile-role">Manager</div>
                </div>
                <div class="metric-icon" style="width: 32px; height: 32px; border-radius: 50%; font-size: 0.9rem;">
                    <i class="fa-solid fa-user-tie"></i>
                </div>
            </div>
        </header>

        <!-- Main Panel -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <h2>Fee Transactions</h2>
                </div>
                <button class="btn-primary" id="btn-add-payment">
                    <i class="fa-solid fa-plus"></i> Record Payment
                </button>
            </div>

            <!-- Payments Table -->
            <div class="table-container">
                <table class="custom-table" id="payments-table">
                    <thead>
                        <tr>
                            <th>Receipt ID</th>
                            <th>Member Name</th>
                            <th>Amount</th>
                            <th>Date</th>
                            <th>Payment Method</th>
                            <th>Status</th>
                            <th style="text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="payments-tbody">
                        <!-- Loaded dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Record Payment Modal -->
    <div class="modal-backdrop" id="payment-modal">
        <div class="modal-window">
            <div class="modal-header">
                <h2>Record Fee Payment</h2>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <form id="payment-form">
                
                <div class="form-group">
                    <label class="form-label" for="payment-member">Gym Member</label>
                    <select id="payment-member" class="form-control" required>
                        <option value="">Select a Member</option>
                        <!-- Loaded dynamically -->
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="payment-amount">Amount Paid (USD)</label>
                        <input type="number" id="payment-amount" step="0.01" class="form-control" placeholder="e.g. 49.99" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="payment-method">Payment Method</label>
                        <select id="payment-method" class="form-control" required>
                            <option value="Credit Card">Credit Card</option>
                            <option value="Cash">Cash</option>
                            <option value="UPI">UPI</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="payment-date">Payment Date</label>
                        <input type="date" id="payment-date" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="payment-status">Status</label>
                        <select id="payment-status" class="form-control" required>
                            <option value="PAID">PAID</option>
                            <option value="PENDING">PENDING</option>
                            <option value="FAILED">FAILED</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
                    <button type="button" class="btn-outline" id="btn-cancel">Cancel</button>
                    <button type="submit" class="btn-primary">Record Payment</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Master Scripts -->
    <script type="module" src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadPayments();
            loadMembersDropdown();

            // Set default date to today
            document.getElementById('payment-date').valueAsDate = new Date();

            // Modal elements
            const modal = document.getElementById('payment-modal');
            const btnAdd = document.getElementById('btn-add-payment');
            const btnClose = document.getElementById('modal-close');
            const btnCancel = document.getElementById('btn-cancel');
            const form = document.getElementById('payment-form');

            // Open modal
            btnAdd.addEventListener('click', () => {
                form.reset();
                document.getElementById('payment-date').valueAsDate = new Date();
                modal.classList.add('show');
            });

            // Close modal
            const closeModal = () => modal.classList.remove('show');
            btnClose.addEventListener('click', closeModal);
            btnCancel.addEventListener('click', closeModal);

            // Handle Quick Action Redirect Action Query Param
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('action') === 'record') {
                btnAdd.click();
            }

            // Auto-fill amount when member is selected based on their plan price
            const memberSelect = document.getElementById('payment-member');
            memberSelect.addEventListener('change', async () => {
                const memberId = memberSelect.value;
                if (!memberId) return;
                
                try {
                    const response = await fetch(`/api/members/${memberId}`);
                    if (response.ok) {
                        const member = await response.json();
                        if (member.plan) {
                            document.getElementById('payment-amount').value = member.plan.price;
                        }
                    }
                } catch (error) {
                    console.error("Error autofilling payment amount:", error);
                }
            });

            // Save Payment Action
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const payload = {
                    memberId: parseInt(document.getElementById('payment-member').value),
                    amount: parseFloat(document.getElementById('payment-amount').value),
                    paymentMethod: document.getElementById('payment-method').value,
                    paymentDate: document.getElementById('payment-date').value,
                    status: document.getElementById('payment-status').value
                };

                try {
                    const response = await fetch('/api/payments', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        closeModal();
                        loadPayments();
                    } else {
                        alert("Error recording payment.");
                    }
                } catch (error) {
                    console.error("Error submitting payment form:", error);
                }
            });
        });

        // Load members for dropdown selection
        async function loadMembersDropdown() {
            try {
                const response = await fetch('/api/members');
                const members = await response.json();
                const select = document.getElementById('payment-member');
                select.innerHTML = '<option value="">Select a Member</option>';
                
                // Show only active members or those with plans
                members.forEach(member => {
                    const opt = document.createElement('option');
                    opt.value = member.id;
                    const planText = member.plan ? ` [${member.plan.name}]` : ' [No Plan]';
                    opt.textContent = `${member.name}${planText}`;
                    select.appendChild(opt);
                });
            } catch (error) {
                console.error("Error loading members for dropdown:", error);
            }
        }

        // Fetch and render payments
        async function loadPayments() {
            try {
                const response = await fetch('/api/payments');
                const payments = await response.json();
                
                const tbody = document.getElementById('payments-tbody');
                tbody.innerHTML = '';

                if (payments.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #646a8a; padding: 2rem;">No transaction history found.</td></tr>`;
                    return;
                }

                payments.forEach(payment => {
                    const tr = document.createElement('tr');
                    
                    const statusClass = payment.status.toLowerCase() === 'paid' ? 'paid' : 
                                      (payment.status.toLowerCase() === 'pending' ? 'pending' : 'inactive');
                    const statusIcon = payment.status.toLowerCase() === 'paid' ? 'fa-circle-check' : 
                                     (payment.status.toLowerCase() === 'pending' ? 'fa-clock' : 'fa-circle-xmark');

                    tr.innerHTML = `
                        <td>
                            <div style="font-weight: 500; font-family: 'Outfit'; color: #9aa0c2;">REC-${payment.id.toString().padStart(5, '0')}</div>
                        </td>
                        <td>
                            <div style="font-weight: 600;">${payment.member.name}</div>
                            <div style="font-size: 0.78rem; color: #646a8a;">${payment.member.email}</div>
                        </td>
                        <td>
                            <div style="font-weight: 700; color: #00e676;">$${payment.amount.toFixed(2)}</div>
                        </td>
                        <td>${payment.paymentDate}</td>
                        <td>
                            <div>${payment.paymentMethod}</div>
                        </td>
                        <td>
                            <span class="badge ${statusClass}"><i class="fa-solid ${statusIcon}"></i> ${payment.status}</span>
                        </td>
                        <td style="text-align: right;">
                            <button class="btn-action delete" onclick="deletePayment(${payment.id})" title="Delete Receipt"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Error loading payments:", error);
            }
        }

        // Delete payment handler
        async function deletePayment(id) {
            if (!confirm("Are you sure you want to delete this payment record? This action cannot be undone.")) return;
            
            try {
                const response = await fetch(`/api/payments/${id}`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    loadPayments();
                } else {
                    alert("Failed to delete payment.");
                }
            } catch (error) {
                console.error("Error deleting payment:", error);
            }
        }
    </script>
</body>
</html>
