<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Management System - Members</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="stylesheet" href="/css/style.css">
    <!-- Immediate Redirect Guard -->
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.replace('/login');
        }
    </script>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-dumbbell"></i>
            <span>APEX FITNESS</span>
        </div>
        <ul class="sidebar-menu">
            <li>
                <a href="/dashboard" class="sidebar-link">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li>
                <a href="/members" class="sidebar-link active">
                    <i class="fa-solid fa-users"></i>
                    <span>Members</span>
                </a>
            </li>
            <li>
                <a href="/plans" class="sidebar-link">
                    <i class="fa-solid fa-address-card"></i>
                    <span>Membership Plans</span>
                </a>
            </li>
            <li>
                <a href="/payments" class="sidebar-link">
                    <i class="fa-solid fa-credit-card"></i>
                    <span>Payments</span>
                </a>
            </li>
            <li>
                <a href="/schedules" class="sidebar-link">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>Workouts</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Header -->
        <header class="top-header">
            <div class="page-title">
                <h1>Member Directory</h1>
                <p>Register, update, and manage your gym members.</p>
            </div>
            <div class="user-profile">
                <div class="user-profile-info">
                    <div class="user-profile-name">Admin Portal</div>
                    <div class="user-profile-role">Manager</div>
                </div>
                <div class="metric-icon" style="width: 32px; height: 32px; border-radius: 50%; font-size: 0.9rem;">
                    <i class="fa-solid fa-user-tie"></i>
                </div>
            </div>
        </header>

        <!-- Main Panel -->
        <div class="panel">
            <div class="panel-header">
                <div class="search-input-group">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="member-search" class="search-control" placeholder="Search members by name or email...">
                </div>
                <button class="btn-primary" id="btn-add-member">
                    <i class="fa-solid fa-user-plus"></i> Register Member
                </button>
            </div>

            <!-- Members Table -->
            <div class="table-container">
                <table class="custom-table" id="members-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Contact Info</th>
                            <th>Plan</th>
                            <th>Join Date</th>
                            <th>Status</th>
                            <th style="text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="members-tbody">
                        <!-- Loaded dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Register/Edit Modal -->
    <div class="modal-backdrop" id="member-modal">
        <div class="modal-window">
            <div class="modal-header">
                <h2 id="modal-title">Register Member</h2>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <form id="member-form">
                <input type="hidden" id="member-id">
                
                <div class="form-group">
                    <label class="form-label" for="member-name">Full Name</label>
                    <input type="text" id="member-name" class="form-control" placeholder="e.g. John Doe" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="member-email">Email Address</label>
                    <input type="email" id="member-email" class="form-control" placeholder="e.g. john.doe@email.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="member-phone">Phone Number</label>
                    <input type="text" id="member-phone" class="form-control" placeholder="e.g. +1 555-0199">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="member-join-date">Join Date</label>
                        <input type="date" id="member-join-date" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="member-plan">Membership Plan</label>
                        <select id="member-plan" class="form-control" required>
                            <option value="">Select a Plan</option>
                            <!-- Loaded dynamically -->
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="member-active">Account Status</label>
                    <select id="member-active" class="form-control">
                        <option value="true">Active</option>
                        <option value="false">Inactive</option>
                    </select>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
                    <button type="button" class="btn-outline" id="btn-cancel">Cancel</button>
                    <button type="submit" class="btn-primary">Save Member</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Master Scripts -->
    <script type="module" src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadMembers();
            loadPlansDropdown();

            // Set default date to today
            document.getElementById('member-join-date').valueAsDate = new Date();

            // Search input listener
            const searchInput = document.getElementById('member-search');
            searchInput.addEventListener('input', debounce(() => {
                loadMembers(searchInput.value);
            }, 300));

            // Modal elements
            const modal = document.getElementById('member-modal');
            const btnAdd = document.getElementById('btn-add-member');
            const btnClose = document.getElementById('modal-close');
            const btnCancel = document.getElementById('btn-cancel');
            const form = document.getElementById('member-form');

            // Open modal to add member
            btnAdd.addEventListener('click', () => {
                document.getElementById('modal-title').textContent = "Register Member";
                document.getElementById('member-id').value = '';
                form.reset();
                document.getElementById('member-join-date').valueAsDate = new Date();
                modal.classList.add('show');
            });

            // Close modal
            const closeModal = () => modal.classList.remove('show');
            btnClose.addEventListener('click', closeModal);
            btnCancel.addEventListener('click', closeModal);

            // Handle Quick Action Redirect Action Query Param
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('action') === 'register') {
                btnAdd.click();
            }

            // Save Member Action
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const memberId = document.getElementById('member-id').value;
                const payload = {
                    name: document.getElementById('member-name').value,
                    email: document.getElementById('member-email').value,
                    phone: document.getElementById('member-phone').value,
                    joinDate: document.getElementById('member-join-date').value,
                    planId: document.getElementById('member-plan').value,
                    active: document.getElementById('member-active').value === "true"
                };

                if (memberId) {
                    payload.id = memberId;
                }

                try {
                    const response = await fetch('/api/members', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        closeModal();
                        loadMembers();
                    } else {
                        const errorMsg = await response.text();
                        alert("Error saving member: " + errorMsg);
                    }
                } catch (error) {
                    console.error("Error submitting member form:", error);
                }
            });
        });

        // Load plans into the dropdown selector
        async function loadPlansDropdown() {
            try {
                const response = await fetch('/api/plans');
                const plans = await response.json();
                const select = document.getElementById('member-plan');
                select.innerHTML = '<option value="">Select a Plan</option>';
                plans.forEach(plan => {
                    const opt = document.createElement('option');
                    opt.value = plan.id;
                    opt.textContent = `${plan.name} ($${plan.price.toFixed(2)})`;
                    select.appendChild(opt);
                });
            } catch (error) {
                console.error("Error loading plans for dropdown:", error);
            }
        }

        // Fetch and render members
        async function loadMembers(query = '') {
            try {
                const url = query ? `/api/members?query=${encodeURIComponent(query)}` : '/api/members';
                const response = await fetch(url);
                const members = await response.json();
                
                const tbody = document.getElementById('members-tbody');
                tbody.innerHTML = '';

                if (members.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #646a8a; padding: 2rem;">No members found.</td></tr>`;
                    return;
                }

                members.forEach(member => {
                    const tr = document.createElement('tr');
                    
                    const statusBadge = member.active 
                        ? `<span class="badge active"><i class="fa-solid fa-circle-check"></i> Active</span>`
                        : `<span class="badge inactive"><i class="fa-solid fa-circle-xmark"></i> Inactive</span>`;
                    
                    const planName = member.plan ? member.plan.name : '<span style="color:#646a8a">No Plan</span>';

                    tr.innerHTML = `
                        <td>
                            <div style="font-weight: 600; font-size: 0.98rem; margin-bottom: 0.2rem;">${member.name}</div>
                            <div style="font-size: 0.78rem; color: #646a8a;">ID: #${member.id}</div>
                        </td>
                        <td>
                            <div><i class="fa-regular fa-envelope" style="width: 14px; margin-right: 0.3rem;"></i> ${member.email}</div>
                            <div style="font-size: 0.82rem; color: #9aa0c2; margin-top: 0.2rem;"><i class="fa-solid fa-phone" style="width: 14px; margin-right: 0.3rem;"></i> ${member.phone || 'N/A'}</div>
                        </td>
                        <td>
                            <div style="font-weight: 500;">${planName}</div>
                        </td>
                        <td>${member.joinDate}</td>
                        <td>${statusBadge}</td>
                        <td style="text-align: right;">
                            <button class="btn-action edit" onclick="editMember(${member.id})" title="Edit"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-action delete" onclick="deleteMember(${member.id})" title="Delete"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Error loading members:", error);
            }
        }

        // Edit member handler
        async function editMember(id) {
            try {
                const response = await fetch(`/api/members/${id}`);
                if (!response.ok) return;
                const member = await response.json();

                document.getElementById('modal-title').textContent = "Edit Member";
                document.getElementById('member-id').value = member.id;
                document.getElementById('member-name').value = member.name;
                document.getElementById('member-email').value = member.email;
                document.getElementById('member-phone').value = member.phone || '';
                document.getElementById('member-join-date').value = member.joinDate;
                document.getElementById('member-plan').value = member.plan ? member.plan.id : '';
                document.getElementById('member-active').value = member.active ? "true" : "false";

                document.getElementById('member-modal').classList.add('show');
            } catch (error) {
                console.error("Error loading member details:", error);
            }
        }

        // Delete member handler
        async function deleteMember(id) {
            if (!confirm("Are you sure you want to delete this member? All associated payment history will be lost.")) return;
            
            try {
                const response = await fetch(`/api/members/${id}`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    loadMembers(document.getElementById('member-search').value);
                } else {
                    alert("Failed to delete member.");
                }
            } catch (error) {
                console.error("Error deleting member:", error);
            }
        }

        // Utility: Debounce for search
        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }
    </script>
</body>
</html>
