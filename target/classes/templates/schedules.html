<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Management System - Workout Schedules</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="stylesheet" href="/css/style.css">
    <!-- Immediate Redirect Guard -->
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.replace('/login');
        }
    </script>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-dumbbell"></i>
            <span>APEX FITNESS</span>
        </div>
        <ul class="sidebar-menu">
            <li>
                <a href="/dashboard" class="sidebar-link">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li>
                <a href="/members" class="sidebar-link">
                    <i class="fa-solid fa-users"></i>
                    <span>Members</span>
                </a>
            </li>
            <li>
                <a href="/plans" class="sidebar-link">
                    <i class="fa-solid fa-address-card"></i>
                    <span>Membership Plans</span>
                </a>
            </li>
            <li>
                <a href="/payments" class="sidebar-link">
                    <i class="fa-solid fa-credit-card"></i>
                    <span>Payments</span>
                </a>
            </li>
            <li>
                <a href="/schedules" class="sidebar-link active">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>Workouts</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Header -->
        <header class="top-header">
            <div class="page-title">
                <h1>Workout Schedules</h1>
                <p>Plan weekly fitness courses, assign coaches, and manage classroom capacities.</p>
            </div>
            <div class="user-profile">
                <div class="user-profile-info">
                    <div class="user-profile-name">Admin Portal</div>
                    <div class="user-profile-role">Manager</div>
                </div>
                <div class="metric-icon" style="width: 32px; height: 32px; border-radius: 50%; font-size: 0.9rem;">
                    <i class="fa-solid fa-user-tie"></i>
                </div>
            </div>
        </header>

        <!-- Main Panel -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <h2>Weekly Training Timetable</h2>
                </div>
                <button class="btn-primary" id="btn-add-schedule">
                    <i class="fa-solid fa-plus"></i> Create Workout Class
                </button>
            </div>

            <!-- Schedules Grid -->
            <div class="schedule-grid" id="schedules-grid">
                <!-- Loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- Create/Edit Modal -->
    <div class="modal-backdrop" id="schedule-modal">
        <div class="modal-window">
            <div class="modal-header">
                <h2 id="modal-title">Create Workout Class</h2>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <form id="schedule-form">
                <input type="hidden" id="schedule-id">
                
                <div class="form-group">
                    <label class="form-label" for="schedule-name">Workout Class Name</label>
                    <input type="text" id="schedule-name" class="form-control" placeholder="e.g. Morning Yoga, Power Cardio" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="schedule-coach">Coach Name</label>
                    <input type="text" id="schedule-coach" class="form-control" placeholder="e.g. Elena Rostova" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="schedule-time">Time Slot</label>
                    <input type="text" id="schedule-time" class="form-control" placeholder="e.g. 07:00 AM - 08:00 AM" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="schedule-day">Day of Week</label>
                        <select id="schedule-day" class="form-control" required>
                            <option value="Monday">Monday</option>
                            <option value="Tuesday">Tuesday</option>
                            <option value="Wednesday">Wednesday</option>
                            <option value="Thursday">Thursday</option>
                            <option value="Friday">Friday</option>
                            <option value="Saturday">Saturday</option>
                            <option value="Sunday">Sunday</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="schedule-capacity">Max Capacity</label>
                        <input type="number" id="schedule-capacity" class="form-control" placeholder="e.g. 20" required>
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
                    <button type="button" class="btn-outline" id="btn-cancel">Cancel</button>
                    <button type="submit" class="btn-primary">Save Workout</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Master Scripts -->
    <script type="module" src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadSchedules();

            // Modal elements
            const modal = document.getElementById('schedule-modal');
            const btnAdd = document.getElementById('btn-add-schedule');
            const btnClose = document.getElementById('modal-close');
            const btnCancel = document.getElementById('btn-cancel');
            const form = document.getElementById('schedule-form');

            // Open modal to add schedule
            btnAdd.addEventListener('click', () => {
                document.getElementById('modal-title').textContent = "Create Workout Class";
                document.getElementById('schedule-id').value = '';
                form.reset();
                modal.classList.add('show');
            });

            // Close modal
            const closeModal = () => modal.classList.remove('show');
            btnClose.addEventListener('click', closeModal);
            btnCancel.addEventListener('click', closeModal);

            // Handle Quick Action Redirect Action Query Param
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('action') === 'create') {
                btnAdd.click();
            }

            // Save Schedule Action
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const scheduleId = document.getElementById('schedule-id').value;
                const payload = {
                    name: document.getElementById('schedule-name').value,
                    coach: document.getElementById('schedule-coach').value,
                    timeSlot: document.getElementById('schedule-time').value,
                    dayOfWeek: document.getElementById('schedule-day').value,
                    maxCapacity: parseInt(document.getElementById('schedule-capacity').value)
                };

                if (scheduleId) {
                    payload.id = parseInt(scheduleId);
                }

                try {
                    const response = await fetch('/api/schedules', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        closeModal();
                        loadSchedules();
                    } else {
                        alert("Error saving workout class.");
                    }
                } catch (error) {
                    console.error("Error submitting schedule form:", error);
                }
            });
        });

        // Fetch and render schedules
        async function loadSchedules() {
            try {
                const response = await fetch('/api/schedules');
                const schedules = await response.json();
                
                const grid = document.getElementById('schedules-grid');
                grid.innerHTML = '';

                if (schedules.length === 0) {
                    grid.innerHTML = '<p style="color: #646a8a; text-align: center; grid-column: 1/-1; padding: 3rem;">No schedules defined.</p>';
                    return;
                }

                schedules.forEach(s => {
                    const card = document.createElement('div');
                    card.className = 'schedule-card';
                    
                    card.innerHTML = `
                        <div class="schedule-card-tag">${s.dayOfWeek}</div>
                        <h3 class="schedule-title">${s.name}</h3>
                        
                        <div class="schedule-info-row">
                            <i class="fa-solid fa-user-tie"></i>
                            <span>Coach: <strong>${s.coach || 'N/A'}</strong></span>
                        </div>
                        
                        <div class="schedule-info-row">
                            <i class="fa-solid fa-clock"></i>
                            <span>${s.timeSlot}</span>
                        </div>
                        
                        <div class="schedule-info-row">
                            <i class="fa-solid fa-users"></i>
                            <span>Max Capacity: <strong>${s.maxCapacity} Members</strong></span>
                        </div>
                        
                        <div class="schedule-actions">
                            <button class="btn-action edit" onclick="editSchedule(${s.id})" title="Edit Class"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-action delete" onclick="deleteSchedule(${s.id})" title="Delete Class"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading schedules:", error);
            }
        }

        // Edit schedule details
        async function editSchedule(id) {
            try {
                const response = await fetch('/api/schedules');
                const schedules = await response.json();
                const s = schedules.find(item => item.id === id);
                if (!s) return;

                document.getElementById('modal-title').textContent = "Edit Workout Class";
                document.getElementById('schedule-id').value = s.id;
                document.getElementById('schedule-name').value = s.name;
                document.getElementById('schedule-coach').value = s.coach || '';
                document.getElementById('schedule-time').value = s.timeSlot;
                document.getElementById('schedule-day').value = s.dayOfWeek;
                document.getElementById('schedule-capacity').value = s.maxCapacity;

                document.getElementById('schedule-modal').classList.add('show');
            } catch (error) {
                console.error("Error loading schedule details:", error);
            }
        }

        // Delete schedule handler
        async function deleteSchedule(id) {
            if (!confirm("Are you sure you want to delete this workout class?")) return;
            
            try {
                const response = await fetch(`/api/schedules/${id}`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    loadSchedules();
                } else {
                    alert("Failed to delete workout class.");
                }
            } catch (error) {
                console.error("Error deleting schedule:", error);
            }
        }
    </script>
</body>
</html>
